# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Every version pinned exactly, never a range or a "+".
#
# F-Droid rebuilds a tagged commit and compares the result against what was
# published. A dependency free to resolve to something newer than it did last
# week makes that comparison fail for a reason nobody can see in the diff, so
# the versions live here and change only when somebody changes them.
#
# Everything here is Apache-2.0 and libre. No Play Services, no Firebase, no
# proprietary SDK - those are F-Droid inclusion requirements, and every one of
# them is cheap now and expensive to unpick later.

[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ktor = "3.0.1"
coroutines = "1.9.0"
serialization = "1.7.3"
androidxCore = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
datastore = "1.1.1"
work = "2.10.5"

[libraries]
# HTTP. Ktor's OkHttp engine, because the client talks to a self-hosted server
# over plain HTTP on a LAN as often as over TLS.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# The token has to survive a restart. DataStore rather than SharedPreferences
# because it is the one with a coroutine API and no main-thread disk read.
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Keeping a book on the device carries on after the app is left, and picks up
# again after Android stops the process. Apache-2.0, AOSP; no Play Services at
# any depth (work-gcm, the one Google-services piece, is a separate artifact
# and not used).
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }

junit = { module = "junit:junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Required from Kotlin 2.0 whenever Compose is enabled, and versioned with the
# compiler rather than separately: they are one thing.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
